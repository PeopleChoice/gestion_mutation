[package]
name = "gestion-mutations"
version = "1.0.0"
description = "Gestion des Mutations — application de bureau"
authors = ["Gestion Mutations"]
edition = "2021"
rust-version = "1.77.2"

# Le binaire produit. Sur Windows : gestion-mutations.exe
[[bin]]
name = "gestion-mutations"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Désactive la console Windows en build de production.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
