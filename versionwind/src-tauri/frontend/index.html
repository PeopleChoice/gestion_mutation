<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion Mutations</title>
    <style>
        html, body { margin: 0; height: 100%; }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
        }
        .logo { font-size: 26px; font-weight: 700; letter-spacing: .5px; margin-bottom: 18px; }
        .spinner {
            width: 44px; height: 44px; border: 4px solid rgba(255,255,255,.25);
            border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        .msg { margin-top: 18px; opacity: .8; font-size: 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="logo">Gestion Mutations</div>
    <div class="spinner"></div>
    <div class="msg">Démarrage du serveur local…</div>
</body>
</html>
