; php.ini du runtime PHP portable embarqué dans l'application de bureau.
; Ce fichier est copié à côté de php.exe par scripts/download-php.ps1.

; Répertoire des extensions (dossier "ext" du build PHP Windows).
extension_dir = "ext"

; --- Extensions requises par Laravel et cette application ---
extension=openssl
extension=pdo_mysql
extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=fileinfo
extension=curl
extension=zip
extension=gd
extension=exif
extension=bcmath
extension=intl

; --- Réglages applicatifs ---
memory_limit = 512M
max_execution_time = 120
post_max_size = 64M
upload_max_filesize = 64M
date.timezone = Africa/Dakar
display_errors = Off
log_errors = On

; cURL : faisceau de certificats (optionnel ; renseigner si appels HTTPS sortants)
; curl.cainfo = "cacert.pem"
; openssl.cafile = "cacert.pem"
