[package]
name = "gestion-mutations-backend"
version = "1.0.0"
edition = "2021"
description = "Backend Rust (Axum) — réécriture native de Gestion Mutations"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Base de données : pool "Any" pour choisir MySQL ou SQLite au runtime
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "any", "mysql", "sqlite",
] }
# Auth
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
# Code de vérification (HMAC-SHA256) + base64
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# QR code (notification) rendu en PNG -> data URI
# default-features = false : on n'utilise QUE le cœur (matrice), le PNG est
# encodé via `image` pour éviter un conflit de version d'`image`.
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
# Divers
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[[bin]]
name = "gestion-mutations-backend"
path = "src/main.rs"
